<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>IM3 Planer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Hanken+Grotesk:wght@400..700&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="buehne">
    <div class="buehne-oben">
      <div class="marke">
        <strong>IM3 Planer</strong>
        <span>Herbstsemester 2026</span>
      </div>
      <nav id="tabs" class="tabs" aria-label="Standort"></nav>
      <button id="modus" class="knopf-modus" type="button">Bearbeiten</button>
    </div>
    <div class="buehne-haupt">
      <h1 id="ort-name">&nbsp;</h1>
      <div class="buehne-stand">
        <div id="zahlen" class="zahlen"></div>
        <div class="balken" aria-hidden="true">
          <span id="balken-erledigt" class="erledigt"></span>
          <span id="balken-geplant" class="geplant"></span>
        </div>
        <p id="prozent" class="prozent"></p>
      </div>
    </div>
  </header>

  <main class="layout">
    <aside id="ablauf" class="ablauf">
      <div class="spalten-kopf">
        <h2>Offen</h2>
        <p>Noch keinem Kurstag zugeteilt.</p>
      </div>
      <div id="legende" class="legende"></div>
      <div id="ablauf-inhalt"></div>
    </aside>

    <section class="tage">
      <div class="spalten-kopf">
        <h2>Stundenplan</h2>
        <p>Auf einem Kurstag heisst geplant, abgehakt heisst erledigt.</p>
      </div>
      <div id="tage-inhalt"></div>
    </section>
  </main>

  <nav class="ansicht-leiste" aria-label="Ansicht">
    <button type="button" data-ansicht="offen">Offen <span id="zahl-offen"></span></button>
    <button type="button" data-ansicht="tage">Stundenplan</button>
  </nav>

  <div id="meldung" class="meldung" role="status" hidden></div>

  <dialog id="aktion-dialog">
    <div class="blatt-kopf">
      <span id="aktion-chip" class="chip" aria-hidden="true"></span>
      <h2 id="aktion-titel"></h2>
      <button type="button" class="knopf-icon" data-schliessen aria-label="Schliessen">✕</button>
    </div>
    <div id="aktion-inhalt"></div>
  </dialog>

  <dialog id="login-dialog">
    <form id="login-form">
      <h2>Bearbeiten</h2>
      <label>Passwort <input name="passwort" type="password" autocomplete="current-password" required></label>
      <div class="aktionen">
        <span class="luecke"></span>
        <button type="button" class="knopf-leise" data-schliessen>Abbrechen</button>
        <button class="knopf">Öffnen</button>
      </div>
    </form>
  </dialog>

  <dialog id="eintrag-dialog">
    <form id="eintrag-form">
      <h2 id="eintrag-ueberschrift">Eintrag bearbeiten</h2>
      <div class="emoji-zeile">
        <label>Emoji <input name="emoji" class="emoji-feld" maxlength="16"></label>
        <div id="emoji-wahl" class="emoji-wahl"></div>
      </div>
      <label>Titel <input name="titel" maxlength="255" required></label>
      <div class="zeile">
        <label data-nur-eintrag>Block <input name="block" list="block-liste" maxlength="100"></label>
        <label>Dauer in Minuten <input name="dauer" type="number" min="0" max="999"></label>
      </div>
      <datalist id="block-liste"></datalist>
      <label class="check" data-nur-eintrag><input type="checkbox" name="zusatz"> Zusatzmaterial</label>
      <label data-nur-eintrag>Link <input name="link" type="url" maxlength="500" placeholder="https://…"></label>
      <label>Kurstag <select name="tag_id"></select></label>
      <label class="check" data-nur-eintrag><input type="checkbox" name="erledigt"> Erledigt</label>
      <label>Notiz <textarea name="notiz" rows="4" maxlength="5000"></textarea></label>
      <div class="aktionen">
        <button type="button" class="knopf-gefahr" id="eintrag-loeschen">Löschen</button>
        <span class="luecke"></span>
        <button type="button" class="knopf-leise" data-schliessen>Abbrechen</button>
        <button class="knopf">Speichern</button>
      </div>
    </form>
  </dialog>

  <dialog id="tag-dialog">
    <form id="tag-form">
      <h2 id="tag-ueberschrift">Kurstag bearbeiten</h2>
      <div class="zeile zeile-gleich">
        <label>Datum <input name="datum" type="date" required></label>
        <label>Zweites Datum (Halbklassen) <input name="datum2" type="date"></label>
      </div>
      <fieldset class="personen-wahl">
        <legend>Dozierende vor Ort</legend>
        <div id="personen-wahl"></div>
      </fieldset>
      <label>Notiz <textarea name="notiz" rows="3" maxlength="2000"></textarea></label>
      <p class="hinweis">Wird ein Kurstag gelöscht, wandern seine Einträge zurück in den Ablauf.</p>
      <div class="aktionen">
        <button type="button" class="knopf-gefahr" id="tag-loeschen">Löschen</button>
        <span class="luecke"></span>
        <button type="button" class="knopf-leise" data-schliessen>Abbrechen</button>
        <button class="knopf">Speichern</button>
      </div>
    </form>
  </dialog>
</body>
</html>
