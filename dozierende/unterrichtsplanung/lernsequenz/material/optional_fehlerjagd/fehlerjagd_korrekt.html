<h1>Zopf backen</h1>

<p>Ein Zopf braucht <strong>wenig Zutaten und viel Geduld.</strong></p>

<h2>Zutaten</h2>

<ul>
  <li>500 g Mehl</li>
  <li>1 Würfel Hefe</li>
  <li>2,5 dl Milch</li>
</ul>

<p>Der Teig muss zweimal aufgehen.</p>
