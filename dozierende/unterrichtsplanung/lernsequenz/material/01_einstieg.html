<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Bircher-Müesli</title>
<style>
  :root { --petrol: #4b93a4; --oliv: #8b8a6e; --text: #575757; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--text);
    background: #f6f6f3;
    line-height: 1.6;
  }
  .seite {
    max-width: 720px;
    margin: 6vh auto;
    background: #fff;
    padding: 64px 72px;
    border-radius: 4px;
    box-shadow: 0 2px 24px rgba(0,0,0,.08);
  }
  h1 {
    font-size: 44px;
    color: var(--oliv);
    margin: 0 0 8px;
    letter-spacing: -.01em;
  }
  h2 {
    font-size: 24px;
    color: var(--petrol);
    margin: 40px 0 12px;
    border-bottom: 2px solid #e4e3da;
    padding-bottom: 6px;
  }
  p { font-size: 20px; margin: 0 0 20px; }
  ul { font-size: 20px; padding-left: 24px; }
  li { margin-bottom: 8px; }
  strong { color: #b5723a; }
</style>
</head>
<body>
  <div class="seite">
    <h1>Bircher-Müesli</h1>
    <p>Das Bircher-Müesli wurde um 1900 von einem Zürcher Arzt entwickelt. Es besteht aus sehr wenigen Zutaten.</p>
    <h2>Zutaten</h2>
    <ul>
      <li>3 Esslöffel Haferflocken</li>
      <li>1 dl Milch</li>
      <li>1 Apfel</li>
    </ul>
    <p>Die Haferflocken brauchen Zeit. <strong>Ohne eine Nacht im Kühlschrank wird das nichts.</strong></p>
  </div>
</body>
</html>
